<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Đoàn Quốc Huy — Fullstack Developer">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative code symbol (right side) -->
  <text x="820" y="420" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="260" font-weight="700" fill="#1e293b" letter-spacing="-4">&lt;/&gt;</text>

  <!-- Accent bar -->
  <rect x="80" y="260" width="64" height="6" rx="3" fill="#2563eb"/>

  <!-- Person name -->
  <text x="80" y="210" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="700" fill="#f1f5f9" letter-spacing="-1">Đoàn Quốc Huy</text>

  <!-- Person title -->
  <text x="80" y="330" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="400" fill="#94a3b8">Fullstack Developer</text>

  <!-- Site URL -->
  <text x="80" y="560" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#475569">quochuy-dev-fs.github.io</text>
</svg>
